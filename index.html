<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ec">
  <title>Floaty Cloud</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f3ec;
      color: #24364a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.9), transparent 32%),
        #f5f3ec;
    }
    .game-shell { width: min(420px, 100%); text-align: center; }
    .eyebrow {
      margin: 0 0 10px;
      color: #8291a0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 14px; font-size: 22px; font-weight: 700; letter-spacing: .04em; }
    .canvas-wrap {
      position: relative;
      width: min(100%, calc((100dvh - 110px) * .583333));
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(36,54,74,.08);
      border-radius: 24px;
      background: #e8f2f5;
      box-shadow: 0 18px 50px rgba(53,75,91,.12), 0 3px 10px rgba(53,75,91,.06);
    }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 7 / 12; touch-action: manipulation; }
    .hint { margin: 13px 0 0; color: #8291a0; font-size: 12px; letter-spacing: .04em; }
    @media (max-height: 640px) {
      body { padding: 8px; }
      .eyebrow { margin-bottom: 4px; }
      h1 { margin-bottom: 7px; font-size: 18px; }
      .hint { margin-top: 6px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <p class="eyebrow">a little sky adventure</p>
    <h1>Floaty Cloud</h1>
    <div class="canvas-wrap">
      <canvas id="game" width="420" height="720" aria-label="雲を操作して障害物を避けるゲーム"></canvas>
    </div>
    <p class="hint">SPACE またはクリックで ふわっと上昇</p>
  </main>

  <script>
    // ゲーム画面の大きさ（描画はこの座標を基準にします）
    const WIDTH = 420;
    const HEIGHT = 720;
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // 高解像度画面でもくっきり見えるようにします。ゲームの座標は変わりません。
    function fitCanvasForScreen() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = WIDTH * pixelRatio;
      canvas.height = HEIGHT * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }
    fitCanvasForScreen();
    window.addEventListener("resize", fitCanvasForScreen);

    const groundHeight = 76;
    const playerX = 112;
    const playerRadius = 19;
    const pipeWidth = 66;
    const pipeGap = 190;
    const pipeSpacing = 248;

    let playerY;
    let playerVelocity;
    let pipes;
    let score;
    let gameState = "ready"; // ready / playing / over
    let lastFrameTime = 0;
    let idleTime = 0;

    // ランダムな高さの障害物を、画面の右側に追加します。
    function makePipe(x) {
      const gapTop = 165 + Math.random() * 280;
      return { x, gapTop, scored: false };
    }

    function resetGame() {
      playerY = HEIGHT * 0.43;
      playerVelocity = 0;
      score = 0;
      pipes = [makePipe(WIDTH + 90), makePipe(WIDTH + 90 + pipeSpacing)];
      gameState = "ready";
    }

    function startOrFlap() {
      if (gameState === "over") resetGame();
      if (gameState === "ready") gameState = "playing";
      playerVelocity = -410; // マイナスの速度は上向き
    }

    // クリック、タップ、スペースキーのどれでも操作できます。
    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      startOrFlap();
    });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        if (!event.repeat) startOrFlap();
      }
    });

    function roundedRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, "#e8f3f5");
      sky.addColorStop(1, "#f4f0e7");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // うすい太陽と遠くの雲で、空に奥行きをつけます。
      ctx.fillStyle = "rgba(255, 224, 170, .72)";
      ctx.beginPath();
      ctx.arc(330, 112, 35, 0, Math.PI * 2);
      ctx.fill();
      drawTinyCloud(285, 228, .8);
      drawTinyCloud(65, 310, .58);
      drawTinyCloud(330, 490, .65);

      ctx.fillStyle = "#e3e7dc";
      ctx.fillRect(0, HEIGHT - groundHeight, WIDTH, groundHeight);
      ctx.fillStyle = "rgba(255,255,255,.58)";
      ctx.fillRect(0, HEIGHT - groundHeight, WIDTH, 5);
      // 地面の小さな点模様
      ctx.fillStyle = "rgba(85,111,117,.12)";
      for (let x = 14; x < WIDTH; x += 28) {
        ctx.beginPath();
        ctx.arc(x, HEIGHT - 35 + (x % 3) * 4, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTinyCloud(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(255,255,255,.48)";
      ctx.beginPath();
      ctx.ellipse(0, 9, 30, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(-12, 4, 13, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(4, -2, 17, 17, 0, 0, Math.PI * 2);
      ctx.ellipse(18, 6, 13, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPipes() {
      for (const pipe of pipes) {
        const gapBottom = pipe.gapTop + pipeGap;
        const pipeColor = "#617d98";
        const shade = "#526f8b";
        // 上下の柱と、少し広い丸い「ふち」を描きます。
        roundedRect(pipe.x, -18, pipeWidth, pipe.gapTop + 18, 13, pipeColor);
        roundedRect(pipe.x - 5, pipe.gapTop - 18, pipeWidth + 10, 18, 8, shade);
        roundedRect(pipe.x, gapBottom, pipeWidth, HEIGHT - groundHeight - gapBottom + 18, 13, pipeColor);
        roundedRect(pipe.x - 5, gapBottom, pipeWidth + 10, 18, 8, shade);
        ctx.fillStyle = "rgba(255,255,255,.13)";
        ctx.fillRect(pipe.x + 11, 0, 5, Math.max(0, pipe.gapTop - 22));
        ctx.fillRect(pipe.x + 11, gapBottom + 21, 5, Math.max(0, HEIGHT - groundHeight - gapBottom - 21));
      }
    }

    function drawPlayer(y) {
      ctx.save();
      ctx.translate(playerX, y);
      // 雲の下に淡い影を置きます。
      ctx.fillStyle = "rgba(65, 88, 105, .12)";
      ctx.beginPath();
      ctx.ellipse(0, 19, 25, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fffefa";
      ctx.beginPath();
      ctx.ellipse(0, 5, 24, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(-12, 1, 12, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(1, -7, 15, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(14, 0, 12, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      // 小さな目と頬
      ctx.fillStyle = "#526577";
      ctx.beginPath();
      ctx.arc(-5, 2, 1.8, 0, Math.PI * 2);
      ctx.arc(7, 2, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#edb8a8";
      ctx.beginPath();
      ctx.ellipse(-12, 8, 3.5, 2, 0, 0, Math.PI * 2);
      ctx.ellipse(14, 8, 3.5, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawScore() {
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.font = "700 42px ui-rounded, sans-serif";
      ctx.fillStyle = "rgba(36,54,74,.15)";
      ctx.fillText(String(score), WIDTH / 2, 36 + 2);
      ctx.fillStyle = "#344b62";
      ctx.fillText(String(score), WIDTH / 2, 36);
    }

    function drawOverlay(title, message, buttonLabel) {
      ctx.fillStyle = "rgba(37, 54, 71, .18)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT - groundHeight);
      const boxX = 38, boxY = 255, boxW = WIDTH - 76, boxH = 205;
      roundedRect(boxX, boxY, boxW, boxH, 24, "rgba(255, 254, 250, .94)");
      ctx.textAlign = "center";
      ctx.fillStyle = "#344b62";
      ctx.font = "700 25px ui-rounded, sans-serif";
      ctx.fillText(title, WIDTH / 2, boxY + 48);
      ctx.fillStyle = "#8291a0";
      ctx.font = "15px ui-rounded, sans-serif";
      ctx.fillText(message, WIDTH / 2, boxY + 83);
      roundedRect(boxX + 38, boxY + 116, boxW - 76, 48, 15, "#617d98");
      ctx.fillStyle = "#fffefa";
      ctx.font = "700 15px ui-rounded, sans-serif";
      ctx.fillText(buttonLabel, WIDTH / 2, boxY + 132);
    }

    function draw() {
      drawBackground();
      drawPipes();
      const cloudY = gameState === "ready" ? playerY + Math.sin(idleTime * 2.2) * 7 : playerY;
      drawPlayer(cloudY);
      if (gameState !== "ready") drawScore();

      if (gameState === "ready") drawOverlay("空へ、ふわっと。", "柱のすき間を通り抜けよう", "クリック / SPACE でスタート");
      if (gameState === "over") drawOverlay("ゲームオーバー", `スコア  ${score}`, "もう一度あそぶ");
    }

    function endGame() {
      gameState = "over";
    }

    function update(deltaTime) {
      idleTime += deltaTime;
      if (gameState !== "playing") return;

      // 重力で下がり、操作するたびに上向きの力が加わります。
      playerVelocity += 1180 * deltaTime;
      playerY += playerVelocity * deltaTime;

      const speed = 175;
      for (const pipe of pipes) {
        pipe.x -= speed * deltaTime;

        // 雲が柱を通り過ぎたら得点します。
        if (!pipe.scored && pipe.x + pipeWidth < playerX) {
          pipe.scored = true;
          score += 1;
        }

        // 雲の中心付近を使ったシンプルな当たり判定です。
        const overlapsX = playerX + playerRadius > pipe.x && playerX - playerRadius < pipe.x + pipeWidth;
        const gapBottom = pipe.gapTop + pipeGap;
        const outsideGap = playerY - playerRadius < pipe.gapTop || playerY + playerRadius > gapBottom;
        if (overlapsX && outsideGap) endGame();
      }

      // 画面の外や地面にぶつかったときもゲーム終了です。
      if (playerY - playerRadius < 0 || playerY + playerRadius > HEIGHT - groundHeight) endGame();

      // 左へ消えた柱を片付け、右側へ新しい柱を足します。
      pipes = pipes.filter((pipe) => pipe.x + pipeWidth > -12);
      if (pipes.length < 2) {
        const lastPipeX = pipes.length ? pipes[pipes.length - 1].x : WIDTH;
        pipes.push(makePipe(Math.max(WIDTH + 30, lastPipeX + pipeSpacing)));
      }
    }

    function frame(timestamp) {
      const deltaTime = Math.min((timestamp - lastFrameTime) / 1000 || 0, 0.033);
      lastFrameTime = timestamp;
      update(deltaTime);
      draw();
      requestAnimationFrame(frame);
    }

    resetGame();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
